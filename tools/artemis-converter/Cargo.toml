[package]
name = "artemis-converter"
version = "0.1.0"
edition = "2021"
description = "Artemis ASB/IET converter for bevy-vn-engine"

[dependencies]
anyhow = "1"
bevy-vn-core = { path = "../../crates/bevy-vn-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
serde_json = "1"
