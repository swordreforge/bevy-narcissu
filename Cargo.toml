[workspace]
resolver = "2"
members = ["crates/bevy-opus-audio", "crates/bevy-vn-core", "crates/bevy-vn-render", "crates/bevy-vn-audio", "crates/bevy-vn-ui", "crates/bevy-vn-save", "crates/bevy-vn-video", "tools/bevy-vn-asset-packer", "tools/artemis-converter", "examples/minimal"]

# Release size/performance tuning. NB: `panic = "abort"` deliberately NOT used:
# bevy 0.19's multi_threaded executor relies on catch_unwind for system-level
# error handling; abort would bypass ErrorHandler and change behavior.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

