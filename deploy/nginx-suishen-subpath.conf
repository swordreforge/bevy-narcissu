# 水仙10周年 — nginx 站点配置(子路径 /bevy-vn-engine/ 版)
# 阿里云 2C2G / 3Mbps;nginx + brotli 模块已装
# 放置于 /etc/nginx/conf.d/suishen.conf,然后 nginx -t && systemctl reload nginx
#
# 部署目录约定: dist/ 内容 rsync 到 /var/www/bevy-vn-engine/
# 访问路径: http://服务器IP或域名/bevy-vn-engine/
#
# 压缩原理:
#   - brotli_static on 客户端 Accept-Encoding: br 时自动返回同目录 .br 文件(带正确头)
#   - gzip_static  on  客户端仅支持 gzip 时返回同目录 .gz 文件
#   - prep.sh 已为 wasm/js/ron/png/font 预生成 .br/.gz
#   - 切勿用 try_files $uri.br 手动分发!会把压缩字节当普通文件返回,页面损坏
#   - 用 root + location 前缀,勿用 alias:alias+try_files 会按 root 拼接双重路径全 404

server {
    listen 80;
    server_name _;  # 有域名则换成你的域名

    # ---- wasm/资产 MIME(必须,否则 wasm 以 text/plain 返回会被浏览器拒绝)----
    types {
        application/wasm wasm;
        audio/ogg ogg;
        image/ktx2 ktx2;
    }

    # ---- Brotli 预压缩文件优先 ----
    brotli on;
    brotli_static on;
    brotli_comp_level 11;
    brotli_types text/plain text/css application/javascript application/wasm
                 application/json application/octet-stream image/svg+xml image/png;

    # ---- gzip 兜底(不支持 brotli 的老浏览器)----
    gzip on;
    gzip_static on;
    gzip_comp_level 9;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/wasm
               application/json application/octet-stream;

    # ---- 子路径站点根:root 指向 /var/www,/bevy-vn-engine/xxx -> /var/www/bevy-vn-engine/xxx ----
    location /bevy-vn-engine/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ =404;

        # 内容寻址静态资产:永久缓存(继承 root)
        location ~* \.(wasm|js|ogg|ktx2|otf|png|jpg|webp|svg|woff2?|ron|list)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # index.html 永不缓存,保证版本更新即时生效
        location = /bevy-vn-engine/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
