# 水仙10周年 — nginx 站点配置模板(阿里云 2C2G / 3Mbps)
# 放置于 /etc/nginx/conf.d/suishen.conf 或 sites-available 后 ln -s 到 sites-enabled
#
# 前置要求(阿里云 Ubuntu/Debian):
#   apt install nginx libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#   验证: nginx -t && systemctl reload nginx
#
# 路径: 将 dist/ 内容部署到 /var/www/suishen/ 下(根路径场景)
# 子路径场景: location /bevy-vn-engine/ 并确保 index.html 用相对路径(已修复,dist 内即是)
#
# 压缩原理:
#   - brotli_static on  客户端 Accept-Encoding: br 时自动返回同目录 .br 文件(带正确头)
#   - gzip_static  on   客户端仅支持 gzip 时返回同目录 .gz 文件
#   - 两者都关时回退原始文件;prep.sh 已为 wasm/js/ron/png/font 预生成 .br/.gz
#   - 切勿用 try_files $uri.br 手动分发!那会把压缩字节当普通文件返回,导致页面损坏

server {
    listen 80;
    server_name _;  # 有域名则换成你的域名

    root /var/www/suishen;
    index index.html;

    # ---- wasm/资产 MIME ----
    types {
        application/wasm wasm;
        audio/ogg ogg;
        image/ktx2 ktx2;
    }

    # ---- Brotli 预压缩文件优先(需 libnginx-mod-http-brotli-static)----
    brotli on;
    brotli_static on;
    brotli_comp_level 11;
    brotli_types text/plain text/css application/javascript application/wasm
                 application/json application/octet-stream image/svg+xml image/png;

    # ---- gzip 兜底(兼容不支持 brotli 的老浏览器)----
    gzip on;
    gzip_static on;
    gzip_comp_level 9;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/wasm
               application/json application/octet-stream;

    # ---- 强缓存:内容寻址文件与静态资产永久缓存 ----
    # 仅 try_files $uri,压缩文件由 brotli_static/gzip_static 模块自动协商返回
    location ~* \.(wasm|js|ogg|ktx2|otf|png|jpg|webp|svg|woff2?|ron|list)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 永不缓存,保证版本更新即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 根路径访问
    location / {
        try_files $uri $uri/ =404;
    }
}
