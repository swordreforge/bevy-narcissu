[package]
name = "bevy-vn-save"
version = "0.1.0"
edition = "2021"
description = "Save/load plugin for bevy-vn-engine"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_ui",
    "bevy_text",
    "bevy_ui_render",
    "bevy_log",
] }
bevy-vn-core = { path = "../bevy-vn-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
