[package]
name = "bevy-vn-core"
version = "0.1.0"
edition = "2021"
description = "Core engine for Bevy-based visual novel games"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_log",
    "vorbis",
    "jpeg",
    "bevy_state",
] }
serde = { version = "1", features = ["derive"] }
ron = "0.8"
serde_json = "1.0.151"
